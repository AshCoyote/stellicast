services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - CI=true npm ci --no-audit --no-fund && exec npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    env_file:
      # Placeholders first so the app boots without credentials; the platform
      # managed secrets file is last and therefore always wins.
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_BASE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 240s
    restart: on-failure
    labels:
      - base44.project=Stellicast
      - base44.kind=web
      - base44.port=3000

volumes:
  web_node_modules:
